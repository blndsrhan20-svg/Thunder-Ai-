<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Thunder"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/src/styles.css"><title>Thunder Messenger</title></head><body><div id="auth" class="auth-screen"><form id="auth-form" class="auth-card"><div class="brand-mark">ϟ</div><p class="eyebrow">PRIVATE MESSAGING</p><h1 id="auth-title">مرحباً بك في Thunder</h1><p class="muted" id="auth-subtitle">تواصل مع الأشخاص المهمين، بسرعة وخصوصية.</p><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required placeholder="name@example.com" dir="ltr"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6 أحرف على الأقل" dir="ltr"></label><div class="auth-actions"><button class="button primary" id="auth-submit">تسجيل الدخول</button><button class="button ghost" id="auth-toggle" type="button">إنشاء حساب</button></div><p id="auth-message" class="feedback" role="status"></p></form></div><div id="app" class="app-shell hidden"><aside class="sidebar"><header class="side-header"><div class="brand-lockup"><div class="brand-mark small">ϟ</div><div><strong>THUNDER</strong><span>MESSENGER</span></div></div><button id="profile-open" class="avatar self-avatar">T</button></header><div class="search-box"><span>⌕</span><input id="search-chats" placeholder="بحث في المحادثات"></div><nav class="tabs"><button class="tab active" data-filter="all">الكل</button><button class="tab" data-filter="unread">غير مقروءة</button><button class="tab" data-filter="groups">المجموعات</button></nav><div class="list-heading"><h2>رسائلك</h2><button id="new-chat" class="icon-button">＋</button></div><div id="conversation-list" class="conversation-list"><div class="empty-state">سجّل الدخول لعرض محادثاتك.</div></div><footer class="side-footer"><button id="settings-open">الإعدادات</button><button id="sign-out">تسجيل الخروج</button></footer></aside><main class="workspace"><section id="empty-workspace" class="empty-workspace"><div class="hero-orb">ϟ</div><h1>كل محادثاتك، في مكان واحد</h1><p>ابدأ محادثة خاصة أو أنشئ مجموعة جديدة.</p><button id="start-chat" class="button primary">ابدأ محادثة</button></section><section id="chat-view" class="chat-view hidden"><header class="chat-header"><button id="back" class="icon-button back-button">→</button><div id="chat-avatar" class="avatar">T</div><div class="chat-title"><strong id="chat-name">محادثة</strong><span id="chat-status">Thunder Messenger</span></div><div class="header-actions"><button id="chat-search-toggle" class="icon-button">⌕</button><button id="chat-menu" class="icon-button">•••</button></div></header><div id="chat-search-row" class="chat-search-row hidden"><input id="search-in-chat" placeholder="ابحث في هذه المحادثة"><button id="close-chat-search">إغلاق</button></div><div id="message-list" class="message-list" aria-live="polite"></div><form id="composer" class="composer"><button id="attach" type="button" class="icon-button attach-button" aria-label="إرسال صورة">＋</button><button id="voice-record" type="button" class="icon-button voice-button" aria-label="تسجيل رسالة صوتية">🎙</button><input id="message-input" maxlength="4000" autocomplete="off" placeholder="اكتب رسالة..." disabled><button id="send" class="send-button" type="submit" disabled>➤</button><input id="file-input" type="file" accept="image/*" hidden></form></section></main></div><div id="dialog" class="dialog-backdrop hidden"><section class="dialog-card"><button id="dialog-close" class="dialog-close">×</button><div id="dialog-content"></div></section></div><div id="toast" class="toast" role="status"></div><script type="module" src="/src/app.js"></script></body></html>
