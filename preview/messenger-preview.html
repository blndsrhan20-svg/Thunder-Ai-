<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018"><title>Thunder Messenger — معاينة مطوّرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1018;--surface:#111925;--surface2:#172231;--surface3:#1d2a3b;--line:#26364a;--text:#f1f5fa;--muted:#8d9caf;--gold:#f4c542;--green:#42d39a;--blue:#78aef5;--shadow:0 18px 55px #0006}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:radial-gradient(ellipse at 15% 0%,#17263a 0,transparent 40%),var(--bg);color:var(--text);overflow:hidden}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{height:100dvh;max-width:1540px;margin:auto;display:grid;grid-template-columns:355px minmax(0,1fr);background:#0e1621;border-inline:1px solid #26364a;box-shadow:var(--shadow)}.sidebar{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,#121d2a,#101824);border-inline-end:1px solid var(--line)}.brand{height:82px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ffe17a,#e5a91d);color:#17130a;display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:0 6px 22px #e8b72d30}.brand strong{font-size:19px;letter-spacing:1.2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:-3px}.profile{margin-inline-start:auto;display:flex;align-items:center;gap:8px}.profile .avatar{width:34px;height:34px;font-size:12px}.profile button{background:transparent;color:var(--muted);font-size:20px}.tools{padding:17px 16px 12px}.searchbox{position:relative}.searchbox span{position:absolute;right:13px;top:10px;color:var(--muted);font-size:18px}.search{width:100%;background:#0b131e;border:1px solid #26364a;border-radius:13px;padding:11px 40px 11px 12px;outline:none;font-size:12px}.search:focus,.composer input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f4c54212}.sectionline{display:flex;align-items:center;justify-content:space-between;padding:5px 18px 11px}.sectionline b{font-size:13px}.sectionline small{color:var(--muted);font-size:10px}.tabs{display:flex;gap:6px;padding:0 15px 13px}.tab{flex:1;padding:8px 4px;border-radius:10px;color:var(--muted);background:transparent;font-size:11px}.tab.active{background:#3a321b;color:var(--gold);font-weight:700}.list{overflow:auto;padding:0 8px 18px}.chat{width:100%;display:flex;align-items:center;gap:11px;text-align:right;padding:12px 10px;border-radius:14px;background:transparent;border:1px solid transparent}.chat:hover{background:#172333}.chat.selected{background:linear-gradient(100deg,#1b2a3d,#182536);border-color:#2a3c52}.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#101722;background:linear-gradient(145deg,#a9d5f5,#507da9);position:relative}.avatar.pink{background:linear-gradient(145deg,#f1b4c6,#9b5a77)}.avatar.green{background:linear-gradient(145deg,#b1e3c3,#4d9472)}.avatar.gold{background:linear-gradient(145deg,#ffe08b,#b88731)}.avatar.violet{background:linear-gradient(145deg,#d2b5fa,#795ba8)}.online{position:absolute;width:11px;height:11px;border:2px solid #172333;background:var(--green);border-radius:50%;bottom:0;right:0}.chat-info{min-width:0;flex:1}.chat-top,.chat-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.chat-name{font-weight:600;font-size:13px}.time,.preview{font-size:10px;color:var(--muted)}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.unread{background:var(--gold);color:#17130a;border-radius:20px;min-width:18px;height:18px;display:grid;place-items:center;font-size:10px;font-weight:700;padding:0 5px}.main{display:flex;flex-direction:column;min-width:0;position:relative;background:radial-gradient(ellipse at 50% 0%,#1b2a3b 0,#111a27 48%,#0d1520 100%)}.welcome{margin:auto;text-align:center;color:var(--muted);max-width:360px;padding:28px}.welcome .logo{margin:0 auto 18px;width:66px;height:66px;font-size:42px;border-radius:20px}.welcome h2{color:var(--text);font-size:22px;margin:0 0 8px}.welcome p{font-size:12px;line-height:2}.conversation{height:100%;display:none;flex-direction:column}.conversation.show{display:flex}.header{height:82px;flex:0 0 82px;display:flex;align-items:center;gap:12px;padding:0 25px;border-bottom:1px solid var(--line);background:#111b28e8;backdrop-filter:blur(14px)}.header .person{flex:1}.person strong{display:block;font-size:14px}.person small{color:var(--green);font-size:10px}.head-actions{display:flex;gap:7px}.icon-btn{width:38px;height:38px;border-radius:12px;background:#1b2939;color:#aab8c9;font-size:17px}.icon-btn:hover{color:var(--gold);background:#26364a}.mobile-back{display:none}.messages{flex:1;overflow:auto;padding:25px clamp(14px,5vw,70px);display:flex;flex-direction:column;gap:13px;background-image:radial-gradient(#9eb1c00b 1px,transparent 1px);background-size:22px 22px}.day{align-self:center;color:#9aa8b8;background:#172333;border:1px solid #29384a;border-radius:30px;padding:5px 13px;font-size:10px;margin:2px 0 12px}.bubble{max-width:min(76%,540px);padding:11px 15px;border-radius:17px;background:#1d2b3c;border:1px solid #2b3d52;font-size:12px;line-height:1.9;align-self:flex-start;border-bottom-right-radius:5px;box-shadow:0 5px 18px #0002;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:linear-gradient(145deg,#59481e,#493a1a);border-color:#77602b;border-bottom-right-radius:17px;border-bottom-left-radius:5px}.bubble time{display:block;text-align:left;font-size:9px;color:#b8b5a7;margin-top:3px}.composer-wrap{padding:14px clamp(12px,4vw,42px) max(13px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111b28}.composer{display:flex;align-items:center;gap:9px}.composer input{flex:1;min-width:0;background:#0b131e;border:1px solid #2a3b50;border-radius:15px;padding:13px 16px;outline:none;font-size:12px}.send{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#ffdc69,#e8b52e);color:#1a1508;font-size:20px;font-weight:700;box-shadow:0 6px 18px #dca92730}.hint{text-align:center;color:#738398;font-size:9px;margin-top:8px}.prototype{position:fixed;bottom:10px;left:10px;z-index:3;background:#2d2819dd;color:#f4d36e;border:1px solid #6d5928;border-radius:9px;padding:6px 10px;font-size:9px;backdrop-filter:blur(8px)}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{border:0}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.brand{height:70px}.header{height:68px;flex-basis:68px;padding:0 12px}.header .avatar{width:40px;height:40px;flex-basis:40px}.mobile-back{display:inline-grid;place-items:center}.messages{padding:17px 12px}.bubble{max-width:88%}.profile{margin-inline-start:auto}.prototype{bottom:6px;left:6px}}
</style></head>
<body>
<div class="app" id="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">ϟ</div><div><strong>THUNDER</strong><small>MESSENGER</small></div><div class="profile"><button aria-label="إعدادات">⚙</button><div class="avatar violet">ن</div></div></div>
 <div class="tools"><div class="searchbox"><span>⌕</span><input class="search" id="search" placeholder="ابحث عن شخص أو محادثة..." aria-label="بحث"></div></div>
 <div class="sectionline"><b>المحادثات</b><small id="chatCount">5 محادثات</small></div>
 <div class="tabs"><button class="tab active" data-filter="all">الكل</button><button class="tab" data-filter="unread">غير مقروءة</button><button class="tab" data-filter="online">متصلون</button></div>
 <div class="list" id="list">
  <button class="chat selected" data-id="1" data-name="آرام أحمد" data-online="true"><div class="avatar">آ<span class="online"></span></div><div class="chat-info"><div class="chat-top"><span class="chat-name">آرام أحمد</span><span class="time">10:42</span></div><div class="chat-bottom"><span class="preview">تمام، أشوفك بعدين 👋</span><span class="unread">2</span></div></div></button>
  <button class="chat" data-id="2" data-name="دانا محمود"><div class="avatar pink">د</div><div class="chat-info"><div class="chat-top"><span class="chat-name">دانا محمود</span><span class="time">09:18</span></div><div class="chat-bottom"><span class="preview">أرسلت صورة 📷</span></div></div></button>
  <button class="chat" data-id="3" data-name="سيروان خالد" data-online="true"><div class="avatar green">س<span class="online"></span></div><div class="chat-info"><div class="chat-top"><span class="chat-name">سيروان خالد</span><span class="time">أمس</span></div><div class="chat-bottom"><span class="preview">صباح الخير، شلونك؟</span><span class="unread">1</span></div></div></button>
  <button class="chat" data-id="4" data-name="مجموعة الأصدقاء"><div class="avatar gold">👥</div><div class="chat-info"><div class="chat-top"><span class="chat-name">مجموعة الأصدقاء</span><span class="time">أمس</span></div><div class="chat-bottom"><span class="preview">علي: نلتقي بالليل؟</span></div></div></button>
  <button class="chat" data-id="5" data-name="هيوا عمر" data-online="true"><div class="avatar violet">هـ<span class="online"></span></div><div class="chat-info"><div class="chat-top"><span class="chat-name">هيوا عمر</span><span class="time">الثلاثاء</span></div><div class="chat-bottom"><span class="preview">وصلت، شكراً إلك</span></div></div></button>
 </div>
</aside>
<main class="main">
 <div class="welcome" id="welcome"><div class="logo">ϟ</div><h2>Thunder Messenger</h2><p>محادثاتك، أصدقاؤك، وكل لحظاتك بمكان واحد.<br>اختر محادثة من القائمة حتى تبدأ.</p></div>
 <section class="conversation show" id="conversation">
  <header class="header"><button class="icon-btn mobile-back" id="back" aria-label="رجوع">→</button><div class="avatar" id="headAvatar">آ<span class="online"></span></div><div class="person"><strong id="headName">آرام أحمد</strong><small id="headStatus">● متصل الآن</small></div><div class="head-actions"><button class="icon-btn" aria-label="بحث داخل المحادثة">⌕</button><button class="icon-btn" aria-label="مكالمة">⌕</button><button class="icon-btn" aria-label="المزيد">⋯</button></div></header>
  <div class="messages" id="messages"><div class="day">اليوم</div></div>
  <div class="composer-wrap"><form class="composer" id="form"><button type="button" class="icon-btn" title="الإرفاق غير مفعل في المعاينة" aria-label="إرفاق">＋</button><input id="message" placeholder="اكتب رسالة..." autocomplete="off"><button class="send" type="submit" aria-label="إرسال">➤</button></form><div class="hint">هذه نسخة عرض تجريبية — الرسائل لا تُرسل إلى مستخدمين ولا تُحفظ</div></div>
 </section>
</main>
</div><div class="prototype">DEMO · بيانات تجريبية فقط</div>
<script>
const app=document.getElementById('app'),welcome=document.getElementById('welcome'),conversation=document.getElementById('conversation'),messages=document.getElementById('messages');
const demo={1:[['هلا، شلونك؟',false,'10:35'],['الحمد لله، تمام. إنت شخبارك؟',true,'10:38'],['كلشي تمام، شفت تحديث ثاندر؟',false,'10:40'],['إي، نشتغل على نسخة المراسلة الجديدة 🔥',true,'10:41'],['تمام، أشوفك بعدين 👋',false,'10:42']],2:[['مرحبا، هاي الصورة اللي حكيتلك عنها 📷',false,'09:16'],['حلوة كلش، تسلمين!',true,'09:18']],3:[['صباح الخير، شلونك؟',false,'08:20'],['صباح النور، بخير الحمد لله',true,'08:25']],4:[['يا جماعة شنو الخطة اليوم؟',false,'أمس'],['نلتقي بالليل؟',false,'أمس']],5:[['وصلت، شكراً إلك',false,'الثلاثاء']]};
function bubble(text,mine,time='الآن'){const b=document.createElement('div');b.className='bubble'+(mine?' mine':'');b.append(document.createTextNode(text));const t=document.createElement('time');t.textContent=time+(mine?' · ✓✓':'');b.append(t);messages.append(b)}
function openChat(el){document.querySelectorAll('.chat').forEach(x=>x.classList.toggle('selected',x===el));welcome.style.display='none';conversation.classList.add('show');app.classList.add('chat-open');document.getElementById('headName').textContent=el.dataset.name;document.getElementById('headStatus').textContent=el.dataset.online==='true'?'● متصل الآن':'آخر ظهور مؤخراً';const a=el.querySelector('.avatar');document.getElementById('headAvatar').textContent=a.textContent.trim();messages.innerHTML='<div class="day">اليوم</div>';(demo[el.dataset.id]||[]).forEach(m=>bubble(m[0],m[1],m[2]));messages.scrollTop=messages.scrollHeight;el.querySelector('.unread')?.remove()}
document.querySelectorAll('.chat').forEach(el=>el.addEventListener('click',()=>openChat(el)));
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message'),v=input.value.trim();if(!v)return;bubble(v,true);input.value='';messages.scrollTop=messages.scrollHeight});
document.getElementById('back').addEventListener('click',()=>app.classList.remove('chat-open'));
function filterChats(){const q=document.getElementById('search').value.trim().toLowerCase(),filter=document.querySelector('.tab.active').dataset.filter;document.querySelectorAll('.chat').forEach(el=>{const unread=!!el.querySelector('.unread'),online=el.dataset.online==='true',match=el.dataset.name.toLowerCase().includes(q);el.style.display=match&&(filter==='all'||(filter==='unread'&&unread)||(filter==='online'&&online))?'flex':'none'})}
document.getElementById('search').addEventListener('input',filterChats);
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));filterChats()}));
openChat(document.querySelector('.chat'));
</script></body></html>
